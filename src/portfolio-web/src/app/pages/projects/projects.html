<div class="projects-body">
  <div class="projects-container">
    <p>Here are some of my projects:</p>
    @for (project of getProjectsList(); track project.getId(); let e = $odd) {
      <app-project-card 
        [project]="project" 
        [reverseLayout]="$odd">
      </app-project-card>
    }
  </div>
</div>
